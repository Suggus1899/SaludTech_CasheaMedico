name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to Render
        run: curl -f -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}" || exit 1

      - name: Deploy web-patient to Vercel
        run: curl -f -X POST "${{ secrets.VERCEL_PATIENT_STAGING_DEPLOY_HOOK }}" || exit 1

      - name: Deploy web-landing to Vercel
        run: curl -f -X POST "${{ secrets.VERCEL_LANDING_STAGING_DEPLOY_HOOK }}" || exit 1

  promote-to-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to Render (production)
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" || exit 1

      - name: Deploy web-patient to Vercel (production)
        run: curl -f -X POST "${{ secrets.VERCEL_PATIENT_DEPLOY_HOOK }}" || exit 1

      - name: Deploy web-landing to Vercel (production)
        run: curl -f -X POST "${{ secrets.VERCEL_LANDING_DEPLOY_HOOK }}" || exit 1
