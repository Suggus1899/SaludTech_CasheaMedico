events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name saludtech.local;

        # Todo el backend ha sido migrado a Go (Puerto 8081)
        location /api/ {
            proxy_pass http://localhost:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /admin/ {
            proxy_pass http://web-admin:3000/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://web-merchant:3001/;
            proxy_set_header Host $host;
        }
    }
}
