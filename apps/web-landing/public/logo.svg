<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A6B8A"/>
      <stop offset="100%" stop-color="#17A589"/>
    </linearGradient>
  </defs>
  <!-- Cross icon -->
  <rect x="4" y="13" width="8" height="14" rx="2" fill="url(#brandGrad)"/>
  <rect x="0" y="17" width="16" height="6" rx="2" fill="url(#brandGrad)"/>
  <!-- Pulse line -->
  <polyline points="20,20 26,20 29,12 33,28 37,16 41,20 47,20" stroke="#17A589" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Text: SaludTech -->
  <text x="54" y="27" font-family="Syne, Inter, sans-serif" font-size="18" font-weight="700" fill="#0A2535">Salud</text>
  <text x="101" y="27" font-family="Syne, Inter, sans-serif" font-size="18" font-weight="700" fill="url(#brandGrad)">Tech</text>
